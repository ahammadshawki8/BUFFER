; BUFFER bench controller
;   pio run -e esp32dev            build for the ESP32 DevKit V1
;   pio run -e esp32dev -t upload  flash it
;   pio test -e native             run the controller logic tests on this computer

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
